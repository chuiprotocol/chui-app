<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240">
  <!-- 嘴付入口 hero（anthropic-art 三層式）：sky 滿版底、象牙白承載形、近黑手繪線。
       隱喻：一隻手把「話語」遞出去，話語落地變成硬幣。 -->
  <rect width="640" height="240" fill="#6A9BCC"/>
  <!-- 不規則象牙白承載形（約 65%） -->
  <path fill="#FAF9F5" d="M84 44 Q60 52 58 92 Q54 140 76 178 Q100 208 180 206 L468 200 Q560 198 576 150 Q590 104 566 66 Q542 36 460 38 L170 40 Q110 38 84 44 Z"/>
  <g stroke="#141413" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 手（極簡輪廓，從左托起） -->
    <path stroke-width="9" d="M96 196 Q92 160 116 150 Q134 143 150 152 M116 150 Q112 128 130 124 Q146 121 152 136 M152 136 Q152 116 170 116 Q186 116 188 134 L190 166 Q190 192 168 200"/>
    <!-- 對話框 -->
    <path stroke-width="9" d="M236 66 Q214 70 212 96 L212 130 Q212 152 236 154 L262 156 L252 182 L292 158 L368 156 Q392 154 394 130 L394 96 Q394 70 370 68 Z"/>
    <!-- 話語＝聲波三撇 -->
    <path stroke-width="8" d="M256 100 Q262 111 256 124"/>
    <path stroke-width="8" d="M282 92 Q292 111 282 132"/>
    <path stroke-width="8" d="M310 86 Q324 111 310 138"/>
    <!-- 箭頭：話語 → 硬幣 -->
    <path stroke-width="8" d="M414 118 Q446 112 468 118 M456 104 L470 118 L454 130"/>
    <!-- 硬幣（不正的圓＋付記號） -->
    <circle cx="520" cy="122" r="38" stroke-width="9" stroke-dasharray="212 14"/>
    <path stroke-width="8" d="M520 102 L519 142 M506 113 L535 112"/>
  </g>
  <!-- 實心點：手繪節奏 -->
  <circle cx="352" cy="112" r="6.5" fill="#141413"/>
  <circle cx="470" cy="80" r="5" fill="#141413"/>
</svg>
