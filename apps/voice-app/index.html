<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>嘴付</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>👄 嘴付</h1>
      <p class="tagline">說了就算，付了就走</p>
      <span id="quota-chip" class="chip"></span>
    </header>

    <div id="msg"></div>

    <!-- 🅐 首次：唯一一次動手——授權 -->
    <section id="authorize-screen" class="hidden">
      <div class="card center">
        <div class="bigicon">🏦</div>
        <h2>授權 <span class="accent">USDC 額度</span>給你的點餐 Agent</h2>
        <p class="bullet">💰 錢進<b>你自己的鏈上 Vault</b>，不是給我們</p>
        <p class="bullet">🎫 Agent 只拿到「額度內代付」的權限</p>
        <p class="bullet">🛑 隨時可撤銷、剩餘金額隨時領回</p>
        <div id="agent-status"></div>
        <form id="topup-form">
          <input id="topup-usdc" type="number" value="1" min="0.3" step="0.1" />
          <button type="submit" class="primary wide">用 Slush 錢包授權（只需這一次）</button>
        </form>
        <p class="fineprint">Sui Testnet 測試幣・授權後點餐全程零按鍵</p>
      </div>
    </section>

    <!-- 🅑 回訪：純語音，零按鍵 -->
    <section id="voice-screen" class="hidden">
      <div class="micwrap">
        <div id="mic-circle" class="mic">🎙️</div>
        <div id="listen-status" class="listening">準備中⋯</div>
        <button id="end-chat" class="endchat" type="button">⏹ 結束對話</button>
        <p class="hint">不用選店家——說出品項，協議會自動找到對的店</p>
      </div>
      <div id="transcript" class="transcript"></div>
      <details class="fallback">
        <summary>打字備援（麥克風不可用時）</summary>
        <form id="text-form">
          <input id="text-input" placeholder="例：我要一份鹽酥雞加辣" autocomplete="off" />
          <button type="submit" class="primary">送出（即下單付款）</button>
        </form>
      </details>
      <p class="fineprint"><a href="#" id="revoke-link">撤銷授權</a>（Slush 簽一筆，立即生效）</p>
    </section>

    <section class="card">
      <h2>接上協議的商家</h2>
      <div id="merchants" class="merchant-list">載入中…</div>
    </section>

    <footer>嘴付協議 demo · Sui Testnet（測試幣，非真實資金）</footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
