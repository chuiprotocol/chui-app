<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- 嘴付 logo：對話框（開口點餐）＋嘴唇＋金幣（說了就付） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4E6A"/>
      <stop offset="1" stop-color="#FF9046"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#F6B93B"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bg)"/>
  <!-- 對話框 -->
  <path d="M20 30 h56 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 H44 l-12 12 v-12 h-12 a8 8 0 0 1 -8 -8 V38 a8 8 0 0 1 8 -8 z"
        fill="#FFFFFF" opacity="0.96"/>
  <!-- 嘴唇（上唇兩瓣＋下唇） -->
  <path d="M32 47 q6 -7 12 -1 q6 -6 12 1 q-12 5 -24 0 z" fill="#E6394F"/>
  <path d="M32 49 q12 10 24 0 q-6 9 -12 9 q-6 0 -12 -9 z" fill="#C22439"/>
  <!-- 金幣 -->
  <circle cx="68" cy="62" r="13" fill="url(#coin)" stroke="#D18F1F" stroke-width="2"/>
  <text x="68" y="67" text-anchor="middle" font-family="ui-rounded, 'PingFang TC', sans-serif"
        font-size="14" font-weight="700" fill="#8A5A00">付</text>
</svg>
