<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>載入中…</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="shop-name">…</h1>
      <p id="shop-tagline" class="tagline"></p>
    </header>

    <div id="msg"></div>

    <section class="card">
      <h2>菜單</h2>
      <div id="menu" class="menu-grid"></div>
    </section>

    <section class="card" id="agent-card">
      <h2>🤖 Chui Agent（一次授權，之後零按鍵）</h2>
      <div id="agent-status">查詢中…</div>
      <form id="topup-form">
        <input id="topup-usdc" type="number" value="5" min="1" step="1" />
        <button type="submit" class="primary">用 Slush 授權撥款（USDC＋gas，只需一次）</button>
      </form>
    </section>

    <section class="card">
      <h2>用說的點餐——說完直接下單付款</h2>
      <button id="talk-btn" class="talk">🎙️ 點一下說話</button>
      <p class="hint">說完不用按任何鍵：靜音自動送出 → 自動下單 → Chui Agent 自動付款</p>
      <div class="or">或用打字的（送出即付款）</div>
      <form id="text-form">
        <input id="text-input" placeholder="例：一杯珍珠奶茶半糖去冰" autocomplete="off" />
        <button type="submit" class="primary">送出</button>
      </form>
    </section>

    <section class="card hidden" id="quote-card">
      <h2>你點的是</h2>
      <p id="readback" class="readback"></p>
      <div id="quote-lines"></div>
    </section>

    <section class="card hidden" id="receipt-card">
      <h2>付款完成 🎉</h2>
      <div id="receipt"></div>
    </section>

    <footer>Powered by 嘴付協議 · Sui Testnet（測試幣，非真實資金）</footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
