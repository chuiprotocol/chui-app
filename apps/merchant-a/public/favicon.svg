<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- 快樂鹽酥雞 logo：紙袋裡的炸雞＋辣椒（夜市攤氣氛） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F76707"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E0"/>
      <stop offset="1" stop-color="#FFE3B3"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bg)"/>
  <!-- 紙袋 -->
  <path d="M28 42 h40 l-4 34 a6 6 0 0 1 -6 5 H38 a6 6 0 0 1 -6 -5 z" fill="url(#bag)"/>
  <path d="M28 42 h40 l-1.5 8 H29.5 z" fill="#F4A62A" opacity="0.55"/>
  <!-- 炸雞塊（金黃、圓潤、顆粒感） -->
  <circle cx="40" cy="36" r="9" fill="#F6B93B" stroke="#D18F1F" stroke-width="2"/>
  <circle cx="56" cy="32" r="10" fill="#F9C74F" stroke="#D18F1F" stroke-width="2"/>
  <circle cx="50" cy="42" r="7" fill="#F4A62A" stroke="#D18F1F" stroke-width="2"/>
  <circle cx="43" cy="33" r="1.6" fill="#B76E12"/>
  <circle cx="58" cy="29" r="1.6" fill="#B76E12"/>
  <circle cx="52" cy="40" r="1.4" fill="#B76E12"/>
  <!-- 辣椒 -->
  <path d="M66 52 q10 4 8 14 q-1 6 -7 7 q4 -9 -3 -17 z" fill="#E03131"/>
  <path d="M64 51 q3 -3 6 -1 l-2 3 q-2 -1 -4 -2 z" fill="#2F9E44"/>
</svg>
