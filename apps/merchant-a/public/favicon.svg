  <path fill="#FAF9F5" d="M24 18 Q14 22 14 40 Q12 62 24 76 Q36 86 58 82 Q80 78 83 56 Q86 34 72 22 Q58 12 40 15 Q30 16 24 18 Z"/>
  <g stroke="#141413" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 雞腿：肉塊不規則輪廓＋骨頭 -->
    <path stroke-width="6.5" d="M30 52 Q26 36 40 30 Q54 24 62 36 Q68 46 60 54 Q50 62 38 58 Q32 56 30 52 Z"/>
    <path stroke-width="5.5" d="M60 52 L72 64 M72 64 Q78 60 76 68 Q84 66 78 72 Q74 76 68 70"/>
    <!-- 顆粒：實心點 -->
  </g>
  <circle cx="42" cy="40" r="3" fill="#141413"/>
  <circle cx="52" cy="46" r="3" fill="#141413"/>
  <circle cx="37" cy="49" r="2.6" fill="#141413"/>
