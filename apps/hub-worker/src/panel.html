<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chui 協議封包面板</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1117; color: #e6edf3; font-family: "Noto Sans TC", system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; }
  .dot.live { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
  #feed { padding: 12px 20px 40px; max-width: 980px; margin: 0 auto; }
  .pkt { display: grid; grid-template-columns: 72px 260px 1fr; gap: 10px; padding: 8px 10px;
         border-bottom: 1px solid #161b22; align-items: baseline; animation: flash 0.8s; }
  @keyframes flash { from { background: #1f2c1f; } to { background: transparent; } }
  .ts { color: #7d8590; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .route { font-size: 0.8rem; white-space: nowrap; }
  .node { padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .n-user { background: #1f6feb33; color: #79c0ff; }
  .n-hub { background: #a371f733; color: #d2a8ff; }
  .n-merchant { background: #3fb95033; color: #56d364; }
  .n-sui { background: #db6d2833; color: #f0883e; }
  .n-voice-app, .n-web { background: #1f6feb33; color: #79c0ff; }
  .arrow { color: #7d8590; margin: 0 4px; }
  .summary { font-size: 0.9rem; word-break: break-all; }
  .kind { color: #7d8590; font-size: 0.72rem; margin-right: 8px; font-family: ui-monospace, monospace; }
  .k-verify .summary { color: #f0883e; }
  .k-verified .summary { color: #3fb950; font-weight: 700; }
  .k-clarify .summary, .k-error .summary, .k-unverified .summary { color: #f85149; }
  footer { text-align: center; color: #484f58; font-size: 0.75rem; padding: 12px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="status"></span>
  <h1>Chui 協議封包面板</h1>
  <span style="color:#7d8590;font-size:.8rem">使用者 → Hub → 商家／Sui Testnet 的每一個協議訊息即時顯示</span>
</header>
<div id="feed"></div>
<footer>Chui Protocol demo · Sui Testnet（測試幣）</footer>
<script>
  const feed = document.getElementById("feed");
  const statusDot = document.getElementById("status");

  function nodeClass(name) {
    if (name.startsWith("merchant")) return "n-merchant";
    if (name === "sui") return "n-sui";
    if (name === "hub") return "n-hub";
    if (name === "user") return "n-user";
    return "n-web";
  }
  function nodeLabel(name) {
    if (name.startsWith("merchant:")) return name.slice(9);
    const map = { hub: "Hub", sui: "Sui", user: "使用者", "voice-app": "語音App" };
    if (name.startsWith("web:")) return name.slice(4) + " 官網";
    return map[name] || name;
  }
  function kindClass(kind) {
    if (kind.includes("verified") && !kind.includes("un")) return "k-verified";
    if (kind.includes("unverified")) return "k-unverified";
    if (kind.includes("verify")) return "k-verify";
    if (kind.includes("clarify")) return "k-clarify";
    if (kind.includes("error")) return "k-error";
    return "";
  }

  function render(evt) {
    const row = document.createElement("div");
    row.className = "pkt " + kindClass(evt.kind);
    const time = new Date(evt.ts * 1000).toLocaleTimeString("zh-TW", { hour12: false });
    row.innerHTML = `
      <span class="ts">${time}</span>
      <span class="route">
        <span class="node ${nodeClass(evt.from)}">${nodeLabel(evt.from)}</span>
        <span class="arrow">→</span>
        <span class="node ${nodeClass(evt.to)}">${nodeLabel(evt.to)}</span>
      </span>
      <span class="summary"><span class="kind">${evt.kind}</span>${evt.summary}</span>`;
    feed.appendChild(row);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function connect() {
    const source = new EventSource("/v1/events");
    source.onopen = () => statusDot.classList.add("live");
    source.onmessage = (e) => render(JSON.parse(e.data));
    source.onerror = () => {
      statusDot.classList.remove("live");
      source.close();
      setTimeout(connect, 2000); // 斷線自動重連
    };
  }
  connect();
</script>
</body>
</html>
