# CI：lint + test（Python API 與 TypeScript 各套件）
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-api:
    name: API（ruff + pytest + 重排序評估）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: 安裝相依
        run: pip install -r apps/api/requirements.txt
      - name: Lint（ruff）
        run: ruff check apps/api/chui_api apps/api/eval apps/api/tests apps/hub/chui_hub scripts/prebuild-tts.py
      - name: 單元與整合測試
        run: cd apps/api && python -m pytest tests/ -q
      - name: 重排序評估（品質門檻：無聲猜錯即失敗）
        run: cd apps/api && python eval/run_eval.py

  typescript:
    name: SDK / console / 店家（build + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安裝相依
        run: pnpm install --frozen-lockfile
      - name: SDK build + test
        run: pnpm --filter @chui/sdk test
      - name: console 型別檢查與建置
        run: pnpm --filter @chui/console build
      - name: chain-service 語法檢查
        run: pnpm --filter @chui/chain-service lint
      - name: 參考店家語法檢查
        run: pnpm --filter @chui/reference-merchant lint
      - name: Demo 各端建置（公版店面／商家A／語音入口／共用庫）
        run: |
          pnpm --filter @chui/web lint
          pnpm --filter @chui/storefront-template build
          pnpm --filter @chui/merchant-a build
          pnpm --filter @chui/voice-app build
          pnpm --filter @chui/portal build
