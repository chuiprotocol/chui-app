# CI：每次 push／PR 跑型別檢查、建置與測試。
# CD 由 Cloudflare Git 整合負責：push 到主分支即自動部署
# chui-hub（Worker）、chui-portal 與 chui-happy-chicken（Pages）。
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: 建置＋測試（Worker 後端與三個前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本讀 package.json 的 packageManager 欄位；這裡再指定會撞出
      # 「Multiple versions of pnpm specified」直接紅燈
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安裝相依
        run: pnpm install --frozen-lockfile
      - name: 共用庫型別檢查
        run: pnpm --filter @chui/web lint
      - name: 雲端 Hub（Worker）型別檢查＋測試（重排序評估集門檻在內）
        run: |
          pnpm --filter @chui/hub-worker build
          pnpm --filter @chui/hub-worker test
      - name: 前端建置（公版入口／商家A官網／公版店面／語音入口）
        run: |
          pnpm --filter @chui/portal build
          pnpm --filter @chui/merchant-a build
          pnpm --filter @chui/storefront-template build
          pnpm --filter @chui/voice-app build

  move-contracts:
    name: Sui Move 合約測試（chui-contracts 子專案在獨立 repo）
    runs-on: ubuntu-latest
    steps:
      - run: echo "合約在 github.com/chuiprotocol/chui-contracts（17 個 Move 測試），該 repo 自帶 CI"
