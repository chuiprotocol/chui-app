# Chui 後端上雲（GMI Cloud／任何 Ubuntu VM 通用）：
#   chui  = 後端整包（Hub＋商家A legacy＋adapter＋商家B，見 Dockerfile）
#   caddy = 反向代理＋自動 HTTPS（Let's Encrypt；網域用 <IP>.sslip.io，
#           免買網域。手機瀏覽器要 HTTPS 才允許呼叫 API 與麥克風）
# 啟動：HUB_DOMAIN=1.2.3.4.sslip.io docker compose up -d --build
services:
  chui:
    build: .
    env_file: .env
    environment:
      - PORT=8700
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HUB_DOMAIN=${HUB_DOMAIN:?請設定 HUB_DOMAIN（例：1.2.3.4.sslip.io）}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - chui
    restart: unless-stopped

volumes:
  caddy_data: {}
