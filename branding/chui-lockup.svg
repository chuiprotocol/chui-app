<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 136" fill="none"
     role="img" aria-labelledby="chui-lockup-title">
  <title id="chui-lockup-title">Chui Protocol 嘴付協議 — 開口就買單，嘴付真簡單</title>
  <!-- 橫式 lockup（README 頂端、簡報封面、投影片頁首用）。
       字樣一律帶 textLength / lengthAdjust：換到沒有 PingFang TC 的系統
       （GitHub 的 Linux 算繪、Windows 檢視者）也不會撐破版面。 -->
  <g transform="translate(-1.05 16.825) scale(0.85)"
     stroke="#101A2E" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(-3 1.5)">
      <path stroke-width="8"
        d="M33 77 L24 99 L46 84 Q60 89 71 81 Q86 71 86 54 Q86 35 70 26 Q54 18 39 25 Q22 33 21 51 Q20 66 30 74 Z"/>
      <path stroke-width="7"   d="M55 32 L54.6 68"/>
      <path stroke-width="6.5" d="M44 43.5 L67 42.7"/>
      <path stroke-width="6.5" d="M44.2 54 L67.2 53.2"/>
      <path stroke-width="6.5" d="M93 38 Q100 52 93 66"/>
      <path stroke-width="6"   d="M103 31 Q112 52 103 73"/>
    </g>
  </g>
  <text x="118" y="70" textLength="292" lengthAdjust="spacingAndGlyphs"
        font-family="'Avenir Next','Helvetica Neue',ui-rounded,system-ui,sans-serif"
        font-size="46" font-weight="800" fill="#101A2E">Chui Protocol</text>
  <text x="118" y="102" textLength="270" lengthAdjust="spacingAndGlyphs"
        font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif"
        font-size="19" font-weight="600" fill="#5A6879">開口就買單，嘴付真簡單</text>
</svg>
