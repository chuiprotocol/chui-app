# Chui 後端整包上 Fly.io（單 App 單機器）。
# 部署：./scripts/deploy-fly.sh（讀 FLY_API_TOKEN，token 絕不進 git）
# App 名稱全球唯一——被占用時：FLY_APP=你的名字 ./scripts/deploy-fly.sh
app = "chui-protocol-hub"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8700"

[http_service]
  internal_port = 8700
  force_https = true
  # 語音點餐要低延遲＋SSE 長連線：機器常駐，不自動休眠
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks]
  [checks.healthz]
    type = "http"
    port = 8700
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
